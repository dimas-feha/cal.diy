name: "Release Docker"

permissions:
  contents: read
  packages: write

env:
  POSTGRES_USER: "unicorn_user"
  POSTGRES_PASSWORD: "magical_password"
  POSTGRES_DB: "calendso"
  DATABASE_HOST: "database:5432"

on:
  push:
    tags:
      - "v*"
  # in case manual trigger is needed
  workflow_dispatch:
    inputs:
      BUILD_FROM_BRANCH:
        description: "Build from the selected branch instead of a tag"
        type: boolean
        default: false
      RELEASE_TAG:
        description: "Tag to build (e.g., v6.0.5) - required if BUILD_FROM_BRANCH is false"
        required: false
      PUSH_IMAGE:
        description: "Push the Docker image to GHCR"
        type: boolean
        default: true

jobs:
  prepare:
    name: "Prepare Release"
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.determine-tag.outputs.release_tag }}
      checkout_ref: ${{ steps.determine-tag.outputs.checkout_ref }}
    steps:
      - name: Validate inputs
        if: github.event_name == 'workflow_dispatch' && inputs.BUILD_FROM_BRANCH == false && inputs.RELEASE_TAG == ''
        run: |
          echo "::error::RELEASE_TAG is required when BUILD_FROM_BRANCH is false"
          exit 1

      - name: "Determine tag and ref"
        id: determine-tag
        run: |
          # Determine checkout ref (always explicit)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.BUILD_FROM_BRANCH }}" = "true" ]; then
            echo "checkout_ref=${GITHUB_REF}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "checkout_ref=refs/tags/${{ inputs.RELEASE_TAG }}" >> $GITHUB_OUTPUT
          else
            echo "checkout_ref=${GITHUB_REF}" >> $GITHUB_OUTPUT
          fi

          # Determine release tag
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.BUILD_FROM_BRANCH }}" = "true" ]; then
              # Extract branch name and short SHA for the tag
              BRANCH_NAME="${GITHUB_REF#refs/heads/}"
              # Sanitize branch name: replace all invalid Docker tag characters with dashes
              # Docker tags can only contain lowercase/uppercase letters, digits, underscores, periods, and dashes
              # Also remove any leading dashes or periods
              SANITIZED_BRANCH=$(echo "$BRANCH_NAME" | sed 's/[^a-zA-Z0-9_.-]/-/g' | sed 's/^[-.]*//')
              SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
              echo "release_tag=${SANITIZED_BRANCH}-${SHORT_SHA}" >> $GITHUB_OUTPUT
            else
              echo "release_tag=${{ inputs.RELEASE_TAG }}" >> $GITHUB_OUTPUT
            fi
          else
            echo "release_tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

  release-amd64:
    name: "Release AMD64"
    needs: prepare
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
    steps:
      - name: checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Build and test Docker image
        uses: ./.github/actions/docker-build-and-test
        with:
          platform: "linux/amd64"
          platform-suffix: ""
          github-token: ${{ secrets.GITHUB_TOKEN }}
          postgres-user: ${{ env.POSTGRES_USER }}
          postgres-password: ${{ env.POSTGRES_PASSWORD }}
          postgres-db: ${{ env.POSTGRES_DB }}
          database-host: ${{ env.DATABASE_HOST }}
          push-image: ${{ (github.event_name == 'push' || inputs.PUSH_IMAGE) && 'true' || 'false' }}
          use-as-latest: "true"

  release-arm:
    name: "Release ARM"
    needs: prepare
    runs-on: ubuntu-24.04-arm
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
    steps:
      - name: checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Build and test Docker image
        uses: ./.github/actions/docker-build-and-test
        with:
          platform: "linux/arm64"
          platform-suffix: "-arm"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          postgres-user: ${{ env.POSTGRES_USER }}
          postgres-password: ${{ env.POSTGRES_PASSWORD }}
          postgres-db: ${{ env.POSTGRES_DB }}
          database-host: ${{ env.DATABASE_HOST }}
          push-image: ${{ (github.event_name == 'push' || inputs.PUSH_IMAGE) && 'true' || 'false' }}

  release-api-amd64:
    name: "Release API v2 (AMD64)"
    needs: prepare
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Get Yarn cache directory
        id: yarn-cache-dir
        run: echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT

      - name: Cache Yarn dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies (on runner, not inside Docker)
        run: yarn install --immutable
        env:
          HUSKY: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API v2 image (AMD64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/api/v2/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' || inputs.PUSH_IMAGE }}
          tags: ghcr.io/dimas-feha/cal.diy-api:${{ env.RELEASE_TAG }}-amd64
          build-args: |
            DATABASE_URL=postgresql://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@${{ env.DATABASE_HOST }}/${{ env.POSTGRES_DB }}
            DATABASE_DIRECT_URL=postgresql://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@${{ env.DATABASE_HOST }}/${{ env.POSTGRES_DB }}

  release-api-arm64:
    name: "Release API v2 (ARM64)"
    needs: prepare
    # Native ARM64 runner — no QEMU, no emulation issues
    runs-on: ubuntu-24.04-arm
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Get Yarn cache directory
        id: yarn-cache-dir
        run: echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT

      - name: Cache Yarn dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-${{ runner.arch }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-yarn-

      - name: Install dependencies (on runner, not inside Docker)
        run: yarn install --immutable
        env:
          HUSKY: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API v2 image (ARM64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/api/v2/Dockerfile
          platforms: linux/arm64
          push: ${{ github.event_name == 'push' || inputs.PUSH_IMAGE }}
          tags: ghcr.io/dimas-feha/cal.diy-api:${{ env.RELEASE_TAG }}-arm64
          build-args: |
            DATABASE_URL=postgresql://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@${{ env.DATABASE_HOST }}/${{ env.POSTGRES_DB }}
            DATABASE_DIRECT_URL=postgresql://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@${{ env.DATABASE_HOST }}/${{ env.POSTGRES_DB }}

  release-api-manifest:
    name: "Release API v2 (Manifest)"
    needs: [prepare, release-api-amd64, release-api-arm64]
    # Only create the manifest when pushing (not on dry-run workflow_dispatch without push)
    if: ${{ github.event_name == 'push' || inputs.PUSH_IMAGE }}
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/dimas-feha/cal.diy-api:${{ env.RELEASE_TAG }} \
            ghcr.io/dimas-feha/cal.diy-api:${{ env.RELEASE_TAG }}-amd64 \
            ghcr.io/dimas-feha/cal.diy-api:${{ env.RELEASE_TAG }}-arm64

      - name: Tag as latest
        if: github.event_name == 'push'
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/dimas-feha/cal.diy-api:latest \
            ghcr.io/dimas-feha/cal.diy-api:${{ env.RELEASE_TAG }}-amd64 \
            ghcr.io/dimas-feha/cal.diy-api:${{ env.RELEASE_TAG }}-arm64
